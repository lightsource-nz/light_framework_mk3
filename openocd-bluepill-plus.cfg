# WeAct BluePill+ (STM32F103C8T6) over an ST-Link.
#
# interface/stlink.cfg + 'transport select swd' -- see openocd-stm32h7.cfg's comment for why
# these spellings rather than stlink-dap.cfg / dapdirect_swd. SWD is selected explicitly:
# the ST-Link also offers JTAG, and this board only breaks out SWD (a 4-pin header).
#
# Confirmed on hardware: connecting reports "device id = 0x20036410" and "flash size = 64 KiB",
# i.e. exactly the STM32F10x Medium Density this .cfg targets.
source [find interface/stlink.cfg]
transport select swd

source [find target/stm32f1x.cfg]

# no SVD referenced, as with the other STM32 boards here: none is vendored for the F1, so
# peripheral register views in a debugger are unavailable until one is added.
