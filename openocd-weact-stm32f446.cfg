# WeAct STM32F446 core board over an ST-Link.
#
# See openocd-bluepill-plus.cfg / openocd-stm32h7.cfg for why these spellings (interface/
# stlink.cfg + explicit 'transport select swd', not the deprecated stlink-dap.cfg).
#
# Confirmed on hardware: connecting reports "device id = 0x10006421" and "STM32F446 - Rev: A",
# with a 512 KiB flash bank -- exactly the STM32F4 family this .cfg targets.
source [find interface/stlink.cfg]
transport select swd

source [find target/stm32f4x.cfg]

# no SVD referenced, as with the other STM32 boards here: none is vendored, so peripheral
# register views in a debugger are unavailable until one is added.
